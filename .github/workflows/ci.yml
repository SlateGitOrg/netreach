name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod declares 1.23 (the minimum the code needs); 1.27 is the
        # toolchain the project was developed and verified with.
        go: ["1.23", "1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      # golangci-lint type-checks against the export data written by the
      # installed Go toolchain. Go 1.27.3 writes export data version 5, which
      # the x/tools importer bundled in golangci-lint v2.13.2 cannot read
      # ("export data version 5 is greater than maximum supported version 4").
      # v2.15.0 reads it and still works with the Go 1.23 leg.
      - name: Install golangci-lint v2.15.0 (prebuilt binary)
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
      - name: make check (gofmt, vet, golangci-lint, race tests, coverage gate)
        run: make check
      - name: Ground truth on fixture topologies
        run: make verify
      - name: Offline end-to-end demo
        run: make demo
      - name: Short fuzz run of the interval algebra
        run: go test -run '^$' -fuzz FuzzSetAlgebra -fuzztime 20s ./interval/
