name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: make check (format, vet, lint, race tests, coverage gate)
        run: make check
      - name: Ground truth on fixture topologies
        run: make verify
      - name: Offline demo
        run: make demo
      - name: Short fuzz run
        run: go test -run '^$' -fuzz FuzzSetAlgebra -fuzztime 20s ./interval/
