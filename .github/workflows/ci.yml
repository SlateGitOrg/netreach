name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod declares 1.23 (the minimum the code needs); 1.27 is the
        # toolchain the project was developed and verified with.
        go: ["1.23", "1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Install golangci-lint v2.13.2 (prebuilt binary)
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
      - name: make check (gofmt, vet, golangci-lint, race tests, coverage gate)
        run: make check
      - name: Ground truth on fixture topologies
        run: make verify
      - name: Offline end-to-end demo
        run: make demo
      - name: Short fuzz run of the interval algebra
        run: go test -run '^$' -fuzz FuzzSetAlgebra -fuzztime 20s ./interval/
